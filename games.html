<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artics Games</title>

<style>
:root {
    color-scheme: dark;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #070b16;
    color: #eef2ff;
    overflow-x: hidden;
    cursor: none;
}

/* BACKGROUND */
#particles, #grid, #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#grid {
    background-image:
        linear-gradient(rgba(123,91,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,91,255,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 12s linear infinite;
    opacity: 0.5;
}

@keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(60px); }
}

#scanlines {
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 4px
    );
    opacity: 0.25;
}

/* CONTENT */
.page-shell {
    position: relative;
    z-index: 5;
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.page-header {
    text-align: center;
}

.page-header h1 {
    font-size: 3rem;
    letter-spacing: 5px;
    margin: 0;
}

#searchBar {
    width: 100%;
    max-width: 420px;
    padding: 12px;
    margin-top: 20px;
    border-radius: 999px;
    border: none;
    text-align: center;
    background: rgba(255,255,255,0.08);
    color: white;
}

/* GRID */
.game-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 30px;
}

/* GAME CARD */
.game-card {
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px) scale(1.03);
}

/* THUMBNAIL */
.game-thumbnail img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
}

/* LABEL */
.game-label {
    padding: 8px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
}

/* HOME */
.home-button {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg,#ff5b77,#7b5bff);
    color: white;
    text-decoration: none;
}

/* CURSOR */
.cursor {
    width: 14px;
    height: 14px;
    background: #7b5bff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    box-shadow: 0 0 20px #7b5bff;
}

/* GAME PLAYER OVERLAY */
#gamePlayer {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99999;
}

#gameFrame {
    width: 100%;
    height: 100%;
    border: none;
}

.close-btn {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100000;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg,#ff5b77,#7b5bff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<script>
function loadGame(url) {
    document.getElementById("gamePlayer").style.display = "block";
    document.getElementById("gameFrame").src = url;
}

function closeGame() {
    document.getElementById("gamePlayer").style.display = "none";
    document.getElementById("gameFrame").src = "";
}

/* CURSOR */
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});
</script>
